apiVersion: v2
name: vertical-pod-autoscaler
description: |
  Automatically adjust resources for your workloads. Tradera fork: adds
  per-VPA opt-in for external metrics, Prometheus-backed OOM observation,
  and per-VPA history backfill via annotations under
  external.vpa.k8s.io/. See the chart README for details.

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# Chart version follows semver. The publish workflow overrides this at
# package time when a `vpa-tradera-v*` tag is pushed; the value here is the
# fallback used by `helm package` runs that don't go through CI.
version: 0.9.0-tradera.0

# Tracks the upstream VPA app version that this fork is based on plus a
# Tradera suffix. The publish workflow overrides this at package time to
# match the actual image tag, so `helm install` of a published chart pulls
# the matching image without an explicit `image.tag` override.
appVersion: "1.6.0-tradera.0"

icon: https://github.com/kubernetes/kubernetes/raw/master/logo/logo.png

maintainers:
  - name: tradera
    url: https://github.com/tradera
